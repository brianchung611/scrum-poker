name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The root postinstall also builds @scrum-poker/shared.
      - run: npm ci

      - run: npm run build

      - run: npm run typecheck

      - run: npm test
